<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>MAOOM — 5×5 Puzzle</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">maoom</div>
      <div class="meta"><span>5 × 5 PUZZLE</span><span id="moves">MOVE 0</span></div>
    </header>

    <section class="stage">
      <div id="board" class="board" aria-label="MAOOM 5 by 5 sliding puzzle"></div>
      <div id="complete" class="complete" aria-live="polite">
        <div>MAOOM</div><small>COMPLETE</small>
      </div>
    </section>

    <footer>
      <button id="shuffle" type="button">SHUFFLE</button>
      <button id="reset" type="button">RESET</button>
    </footer>
  </main>
  <script src="./script.js"></script>
</body>
</html>
